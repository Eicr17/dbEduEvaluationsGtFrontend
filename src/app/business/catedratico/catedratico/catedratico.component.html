<div class="p-1">
    <div class="flex flex-col mb-6">
        <h1 class="text-xl font-bold text-gray-800">
            Catedraticos
        </h1>

        <button onclick="document.getElementById('ModalCat').showModal()"
            class=" mt-4 w-fit px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow-sm transition-colors">
            Agregar Catedratico
        </button>
    </div>
</div>

<div class="overflow-x-auto shadow-md rounded-lg border border-gray-200">
    <table class="w-full text-sm text-left text-gray-500">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200">
            <tr>
                <th scope="col" class="px-6 py-3">Alumno</th>
                <th scope="col" class="px-6 py-3">Grado</th>
                <th scope="col" class="px-6 py-3">Nombre</th>
                <th scope="col" class="px-6 py-3">Apellido</th>
                <th scope="col" class="px-6 py-3">Correo</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 bg-white">
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 font-medium text-gray-900">Ana Pérez</td>
                <td class="px-6 py-4">Desarrolladora Frontend</td>
                <td class="px-6 py-4">
                    <span
                        class="px-2.5 py-0.5 text-xs font-semibold text-green-800 bg-green-100 rounded-full">Activo</span>
                </td>
                <td class="px-6 py-4">
                    <a href="#" class="font-medium text-blue-600 hover:underline">Editar</a>
                </td>
            </tr>
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 font-medium text-gray-900">Carlos Gómez</td>
                <td class="px-6 py-4">Diseñador UI/UX</td>
                <td class="px-6 py-4">
                    <span class="px-2.5 py-0.5 text-xs font-semibold text-yellow-800 bg-yellow-100 rounded-full">En
                        pausa</span>
                </td>
                <td class="px-6 py-4">
                    <a href="#" class="font-medium text-blue-600 hover:underline">Editar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>


<dialog id="ModalCat" class="p-0 rounded-2xl shadow-2xl backdrop:bg-black/50 w-full max-w-lg open:animate-fade-in">
  <div class="bg-white p-6 flex flex-col gap-4">

    <!-- Encabezado -->
    <div class="flex justify-between items-center border-b pb-3">
      <h3 class="text-xl font-bold text-gray-800">Datos del Catedrático</h3>
      <button onclick="document.getElementById('ModalCat').close()"
        class="text-gray-400 hover:text-gray-600 font-bold text-xl leading-none">
        &times;
      </button>
    </div>

    <!-- Contenido / Formulario -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- Fila 1 / Columna 1 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">No. Catedrático</label>
        <input type="text"
          class="w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 text-sm outline-none" />
      </div>

      <!-- Fila 1 / Columna 2 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Grado</label>
        <select
          class="w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 text-sm outline-none bg-white text-gray-700">
          <option value="" disabled selected>Seleccionar grado...</option>
          <option value="lic">Licenciatura</option>
          <option value="ing">Ingeniería</option>
          <option value="msc">Maestría</option>
          <option value="dr">Doctorado</option>
        </select>
      </div>

      <!-- Fila 2 / Ocupa las 2 columnas -->
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input type="text"
          class="w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 text-sm outline-none" />
      </div>

      <!-- Fila 3 / Columna 1 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo</label>
        <input type="email"
          class="w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 text-sm outline-none" />
      </div>

      <!-- Fila 3 / Columna 2 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
        <input type="text"
          class="w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 text-sm outline-none" />
      </div>

    </div>

    <!-- Botones de acción -->
    <div class="flex justify-end gap-3 pt-3 border-t mt-2">
      <button onclick="document.getElementById('ModalCat').close()"
        class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 text-sm font-medium transition-colors">
        Cancelar
      </button>
      <button onclick="document.getElementById('ModalCat').close()"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium transition-colors">
        Confirmar
      </button>
    </div>

  </div>
</dialog>
