<div class="p-1">
    <div class="flex flex-col mb-6">
        <h1 class="text-xl font-bold text-gray-800">
            Grados
        </h1>

        <button onclick="document.getElementById('ModalGrado').showModal()"
            class=" mt-4 w-fit px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow-sm transition-colors"
             (click)="NuevoGrado()">
            Agregar Grado
        </button>
    </div>
</div>

<div class="overflow-x-auto shadow-md rounded-lg border border-gray-200">
    <table class="w-full text-sm text-left text-gray-500">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200">
            <tr>
                <th scope="col" class="px-6 py-3">Grado</th>
                <th scope="col" class="px-6 py-3">Nombre</th>
                <th scope="col" class="px-6 py-3">Seccion</th>
                <th scope="col" class="px-6 py-3">Anio Lectivo</th>
                <th scope="col" class="px-6 py-3">Catedratico</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 bg-white">
            <tr *ngFor="let item of lstGradoInsert; let i = index" class="hover:bg-gray-50">

        <td class="px-6 py-4 font-medium text-gray-900">
          {{ item.idGrado }}
        </td>

        <td class="px-6 py-4">
          {{item.nombreGrado}}
        </td>

        <td class="px-6 py-4">
          {{ item.seccion }}
        </td>

        <td class="px-6 py-4">
          {{ item.anioLectivo }}
        </td>

        <td class="px-6 py-4">
          {{ item.idCatedratico }}
        </td>

        <td class="px-6 py-4">
      <div class="flex items-center gap-4">
          <button type="button" 
            (click)="EditarGrado(item, i)" class="p-2
             text-blue-600
             bg-blue-50
             rounded-lg
             hover:bg-blue-100
             hover:text-blue-700
             transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">

              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />

            </svg>
            Editar
          </button>

          <button type="button" (click)="EliminarGrado(item.idGrado)" class="p-2
             text-red-600
             bg-red-50
             rounded-lg
             hover:bg-red-100
             hover:text-red-700
             transition-colors">

            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">

              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16" />

            </svg>
            
            Eliminar
          </button>
    </div>
        </td>
      </tr>
        </tbody>
    </table>
</div>

<!-- Ventana Modal -->
<form  [formGroup]="FormGrado" (ngSubmit)="AgregarGrado()">
<dialog id="ModalGrado" class="p-0 rounded-2xl shadow-2xl backdrop:bg-black/50 w-full max-w-md open:animate-fade-in">
  <div class="bg-white p-6 flex flex-col gap-4">
    
    <!-- Encabezado -->
    <div class="flex justify-between items-center border-b pb-3">
      <h3 class="text-xl font-bold text-gray-800">Ingrese Datos del Grado</h3>
      <button onclick="document.getElementById('ModalGrado').close()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">
        &times;
      </button>
    </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

  <!-- Fila 1 / Columna 1 -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Grado</label>
    <input type="number"
      formControlName="idGrado" 
      class="w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 text-sm outline-none" />
  </div>

  <!-- Fila 1 / Columna 2 -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Sección</label>
    <input type="text"
      formControlName="seccion"
      class="w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 text-sm outline-none" />
  </div>

  <!-- Fila 2 / Ocupa las 2 columnas (ideal para un nombre completo) -->
  <div class="md:col-span-2">
    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
    <input type="text"
      formControlName="nombreGrado"
      class="w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 text-sm outline-none" />
  </div>

  <!-- Fila 3 / Columna 1 -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Año Lectivo</label>
    <input type="number"
      formControlName="anioLectivo"
      class="w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 text-sm outline-none" />
  </div>

  <!-- Fila 3 / Columna 2 -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Catedrático</label>
    <select
      formControlName="idCatedratico"
      class="w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 p-2 text-sm outline-none bg-white text-gray-700">
      <option value="" disabled selected>Seleccionar Catedrático...</option>
      <option value="1">Juan</option>
      <option value="2">Pablo</option>
      <option value="3">Noelia</option>
      <option value="4">Marco</option>
    </select>
  </div>

</div>

    <!-- Botones de acción -->
    <div class="flex justify-end gap-3 pt-3 border-t">
      <button onclick="document.getElementById('ModalGrado').close()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 text-sm font-medium transition-colors">
        Cancelar
      </button>
      <button  type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium transition-colors">
        Confirmar
      </button>
    </div>

  </div>
</dialog>
</form>
